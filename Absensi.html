<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petualangan Absensi Ceria 🚀</title>
  
  <!-- face-api.js (Disamakan dengan Daftar.html agar akurat) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap');

    * { box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Bentuk Awan Kartun Lembut */
    .cloud {
      position: absolute;
      background: #ffffff;
      border-radius: 100px;
      z-index: 0;
      opacity: 0.85;
      animation: floatCloud 25s linear infinite;
    }
    
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
    }

    .cloud1 {
      width: 160px; height: 60px; top: 10%; left: -180px; animation-duration: 28s;
    }
    .cloud1::before { width: 70px; height: 70px; top: -35px; left: 25px; }
    .cloud1::after { width: 90px; height: 90px; top: -45px; left: 70px; }

    .cloud2 {
      width: 220px; height: 75px; top: 70%; left: -240px; animation-duration: 35s; animation-delay: 6s;
    }
    .cloud2::before { width: 90px; height: 90px; top: -45px; left: 35px; }
    .cloud2::after { width: 110px; height: 110px; top: -55px; left: 95px; }

    @keyframes floatCloud {
      0% { transform: translateX(0); }
      100% { transform: translateX(120vw); }
    }

    /* Kartu Utama */
    .card {
      position: relative;
      z-index: 10;
      background: #ffffff;
      width: 100%;
      max-width: 620px;
      padding: 40px 35px;
      border-radius: 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15), inset 0 -10px 0 #e2e8f0;
      border: 6px solid #fff;
      text-align: center;
    }

    .header-badge {
      display: inline-block;
      background: #ff70a6;
      color: white;
      font-family: 'Fredoka One', cursive;
      font-size: 1em;
      padding: 8px 22px;
      border-radius: 25px;
      letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(255, 112, 166, 0.4);
      margin-bottom: 12px;
      transform: rotate(-2deg);
    }

    h2 {
      font-family: 'Fredoka One', cursive;
      color: #3a86ff;
      font-size: 2.4em;
      margin: 5px 0 12px 0;
      text-shadow: 2px 2px 0px #ffbe0b;
      letter-spacing: 1px;
    }

    /* Kotak Status */
    .status-box {
      font-weight: 800;
      font-size: 1.1em;
      padding: 15px 20px;
      margin-bottom: 25px;
      border-radius: 22px;
      background: #fff9db;
      color: #d97706;
      border: 3px dashed #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .status-box.active {
      background: #e6fcf5;
      color: #0ca678;
      border-color: #20c997;
    }

    /* Area Kamera */
    .camera-outer {
      position: relative;
      width: 360px;
      height: 360px;
      margin: 0 auto 30px auto;
    }

    .ear {
      position: absolute;
      width: 75px;
      height: 75px;
      background: #ffbe0b;
      border-radius: 50%;
      top: -18px;
      z-index: 1;
      border: 5px solid #fff;
    }
    .ear.left { left: 25px; }
    .ear.right { right: 25px; }

    .video-container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      background: #212529;
      border-radius: 50%;
      overflow: hidden;
      border: 9px solid #ffbe0b;
      box-shadow: 0 15px 30px rgba(255, 190, 11, 0.4), inset 0 0 20px rgba(0,0,0,0.5);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: #00f5d4;
      box-shadow: 0 0 15px #00f5d4, 0 0 25px #00f5d4;
      animation: scanning 2.2s infinite ease-in-out;
      z-index: 10;
      border-radius: 10px;
    }

    @keyframes scanning {
      0% { top: 5%; opacity: 0.2; }
      50% { top: 90%; opacity: 1; }
      100% { top: 5%; opacity: 0.2; }
    }


    /* Modal Popup */
    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 35px;
      width: 88%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border: 6px solid #ffbe0b;
      animation: popBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popBounce {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-avatar {
      font-size: 70px;
      margin-bottom: 8px;
      animation: pulseEmoji 1s infinite alternate;
    }

    @keyframes pulseEmoji {
      0% { transform: scale(1); }
      100% { transform: scale(1.15) rotate(5deg); }
    }

    .modal-title {
      font-family: 'Fredoka One', cursive;
      color: #38b000;
      font-size: 2em;
      margin-bottom: 10px;
    }

    .modal-title.warning {
      color: #e63946;
    }

    .modal-desc {
      color: #495057;
      font-weight: 800;
      font-size: 1.15em;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .btn-ok {
      background: linear-gradient(45deg, #38b000, #70e000);
      color: white;
      border: none;
      padding: 14px 40px;
      border-radius: 50px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.2em;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(56, 176, 0, 0.4), inset 0 -3px 0 rgba(0,0,0,0.2);
      transition: 0.2s;
    }

    .btn-ok.warning {
      background: linear-gradient(45deg, #e63946, #ff4d6d);
      box-shadow: 0 6px 15px rgba(230, 57, 70, 0.4), inset 0 -3px 0 rgba(0,0,0,0.2);
    }

    .btn-ok:hover {
      transform: scale(1.08);
    }
  </style>
</head>
<body>

  <!-- Dekorasi Awan Kartun -->
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <div class="card">
    <div class="header-badge">SD PINTAR & CERIA 🎈</div>
    <h2>Absensi Wajah 📸</h2>
    
    <div id="status" class="status-box">
      <span>⏳ Memuat data siswa...</span>
    </div>

    <!-- Frame Kamera Bulat -->
    <div class="camera-outer">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="video-container">
        <div class="scan-line"></div>
        <video id="video" autoplay muted playsinline></video>
      </div>
    </div>

  </div>

  <!-- Modal Popup Notifikasi -->
  <div id="successModal" class="modal-overlay">
    <div class="modal-box">
      <div id="modalAvatar" class="success-avatar">🌟🎉</div>
      <div id="modalTitle" class="modal-title">Hore, Berhasil!</div>
      <div id="modalTextName" class="modal-desc">Selamat Pagi, Budi!</div>
      <button type="button" id="btnModalOk" class="btn-ok" onclick="closeSuccessModal()">HORE! 👍</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycby1pdvSMexJojXPK3kjAHSKjvDQVcVQBckrqhdKAIwmwTYfI6NJyI4Gab4XiyaOYyyrzw/exec';

    const video = document.getElementById('video');
    const statusDiv = document.getElementById('status');
    const successModal = document.getElementById('successModal');
    const modalAvatar = document.getElementById('modalAvatar');
    const modalTitle = document.getElementById('modalTitle');
    const modalTextName = document.getElementById('modalTextName');
    const btnModalOk = document.getElementById('btnModalOk');

    let modelsLoaded = false;
    let daftarSiswa = [];
    let isProcessing = false;
    let isCooldown = false;

    // Load model face-api.js
    async function init() {
      try {
        statusDiv.innerHTML = "<span>🔄 Mengambil data dari database...</span>";
        const response = await fetch(API_URL + '?action=getSiswa');
        daftarSiswa = await response.json();

        if (daftarSiswa.length === 0) {
          statusDiv.innerHTML = "<span>⚠️ Belum ada siswa terdaftar!</span>";
          return;
        }

        statusDiv.innerHTML = "<span>🤖 Memuat AI Pemindai Wajah...</span>";
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        modelsLoaded = true;

        startCamera();
      } catch (err) {
        statusDiv.innerHTML = "<span>❌ Gagal muat data/AI: " + err.message + "</span>";
      }
    }

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ 
        video: { 
          facingMode: { ideal: "user" }, 
          width: { ideal: 640 }, 
          height: { ideal: 480 } 
        } 
      })
      .then(stream => {
        video.srcObject = stream;
        statusDiv.className = "status-box active";
        statusDiv.innerHTML = "<span>😃 Siap! Senyum & dekati kamera ya!</span>";
        // Interval 1200ms agar stabil dan tidak membebani browser
        setInterval(detectAndScan, 1200);
      })
      .catch(err => {
        statusDiv.innerHTML = "<span>📷 Gagal buka kamera! Check izin browser.</span>";
      });
    }

    function ucapkanPesan(kalimat, isError = false) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance(kalimat);
        speech.lang = 'id-ID';
        speech.rate = 1.2;
        speech.pitch = isError ? 1.0 : 1.3;
        window.speechSynthesis.speak(speech);
      }
    }

    async function detectAndScan() {
      if (!modelsLoaded || isProcessing || isCooldown || daftarSiswa.length === 0) return;
      if (successModal.style.display === 'flex') return;

      isProcessing = true;

      try {
        // Deteksi wajah tunggal menggunakan face-api.js
        const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

        if (detection) {
          statusDiv.innerHTML = "<span>🔍 Wajah terdeteksi! Mencocokkan...</span>";
          const currentDescriptor = Array.from(detection.descriptor);

          let bestMatch = null;
          let minDistance = Infinity;

          daftarSiswa.forEach(siswa => {
            if (siswa.descriptor) {
              const parsedDescriptor = typeof siswa.descriptor === 'string' ? JSON.parse(siswa.descriptor) : siswa.descriptor;
              
              // Perhitungan Euclidean distance khusus face-api.js
              const dist = faceapi.euclideanDistance(currentDescriptor, parsedDescriptor);
              
              if (dist < minDistance) {
                minDistance = dist;
                bestMatch = siswa;
              }
            }
          });

          // Ambang batas (threshold) ideal 0.48 - 0.52 agar akurat dan tidak salah
          if (bestMatch && minDistance < 0.50) {
            
            isCooldown = true; 

            // === VALIDASI WAKTU: Cek apakah sudah pukul 16:30 WIB ===
            const sekarang = new Date();
            const totalMenitSekarang = sekarang.getHours() * 60 + sekarang.getMinutes();
            const totalMenitBatas = 10 * 60 + 30; // 10:30

            if (totalMenitSekarang < totalMenitBatas) {
              statusDiv.innerHTML = "<span>⏰ Belum waktunya absen!</span>";
              modalAvatar.innerText = "⏳⏰";
              modalTitle.innerText = "Waktu Belum Tiba!";
              modalTitle.classList.add("warning");
              modalTextName.innerText = `Halo ${bestMatch.nama}, waktu absen dibuka mulai pukul 16:30 WIB ya!`;
              btnModalOk.innerText = "MENGERTI 🛑";
              btnModalOk.classList.add("warning");
              
              successModal.style.display = 'flex';
              ucapkanPesan(`Halo ${bestMatch.nama}, waktu absen belum tiba.`, true);
              return; 
            }

            // === JIKA WAKTU SUDAH TEPAT (>= 16:30 WIB) ===
            statusDiv.innerHTML = "<span>🎉 Berhasil kenal: " + bestMatch.nama + "!</span>";

            modalAvatar.innerText = "🌟🎉";
            modalTitle.innerText = "Hore, Berhasil!";
            modalTitle.classList.remove("warning");
            modalTextName.innerText = "Halo " + bestMatch.nama + "! Absen kamu berhasil. Semangat belajar ya! 🌟";
            btnModalOk.innerText = "HORE! 👍";
            btnModalOk.classList.remove("warning");

            successModal.style.display = 'flex';
            
            const daftarPanggilan = [
              "Hore! " + bestMatch.nama + " sudah hadir. Semangat belajarnya ya!",
              "Halo " + bestMatch.nama + "! Selamat sore, semoga hari ini menyenangkan!",
              "Yeay! " + bestMatch.nama + " sudah absen. Selamat mengikuti pelajaran ya!"
            ];
            const kalimatUcapan = daftarPanggilan[Math.floor(Math.random() * daftarPanggilan.length)];
            ucapkanPesan(kalimatUcapan, false);

            const payload = {
              action: 'catatAbsensi',
              data: bestMatch
            };

            // Kirim data absensi ke Google Sheets
            fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(payload)
            }).catch(err => console.log("Log: " + err));

            return; 

          } else {
            statusDiv.innerHTML = "<span>🤔 Wajah tidak dikenali! Silakan daftar dulu.</span>";
          }
        } else {
          statusDiv.innerHTML = "<span>😃 Siap! Senyum & dekati kamera ya!</span>";
        }
      } catch (err) {
        console.error("Error scan:", err);
      } finally {
        if (!isCooldown) {
          setTimeout(() => {
            isProcessing = false;
          }, 800);
        }
      }
    }

    function closeSuccessModal() {
      successModal.style.display = 'none';
      statusDiv.innerHTML = "<span>🔄 Siap untuk teman berikutnya...</span>";
      
      // Jeda cooldown 2.5 detik agar sempat menjauhkan wajah
      setTimeout(() => {
        isProcessing = false;
        isCooldown = false;
        statusDiv.innerHTML = "<span>😃 Siap! Senyum & dekati kamera ya!</span>";
      }, 2500);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
